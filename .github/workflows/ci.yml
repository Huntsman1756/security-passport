name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests
      - name: mypy strict
        run: mypy src
      - name: tests (offline)
        run: pytest tests/ -q
      - name: release gate — goldens + validator
        run: |
          SECURITY_PASSPORT_PROVIDER=fixtures \
          SECURITY_PASSPORT_FIXTURES=tests/fixtures/corpus \
            python -m security_passport.cli.main validate

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: build api image
        run: docker build -f infra/docker/Dockerfile.api -t security-passport-api .
      - name: build web image
        run: docker build -f infra/docker/Dockerfile.web -t security-passport-web .

  e2e:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: python -m pip install -e ".[dev]"
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: api (fixture mode)
        run: |
          SECURITY_PASSPORT_PROVIDER=fixtures \
          SECURITY_PASSPORT_FIXTURES=tests/fixtures/corpus \
            python -m uvicorn security_passport.api.app:app \
              --host 127.0.0.1 --port 8000 &
          sleep 4
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm test:e2e
        working-directory: web
