name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # GitHub Release upload
  id-token: write        # artifact attestation
  attestations: write
  packages: write        # GHCR publish

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.25"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: tag == package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(uv run python -c \
            "from importlib.metadata import version; \
             import tomllib,pathlib; \
             print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          test "$TAG" = "$PKG" || { echo "tag $TAG != package $PKG"; exit 1; }
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest tests/ -q
      - name: golden validator
        run: |
          SECURITY_PASSPORT_PROVIDER=fixtures \
          SECURITY_PASSPORT_FIXTURES=tests/fixtures/corpus \
            uv run python -m security_passport.cli.main validate
      - name: public hygiene
        run: uv run python scripts/check_public_hygiene.py
      - name: frontend build
        run: |
          cd web
          corepack enable
          pnpm install --frozen-lockfile
          pnpm lint && pnpm typecheck && pnpm test && pnpm build

  artifacts:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.25"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: build distributions
        run: uv build
      - name: twine check
        run: uv run --with twine twine check dist/*
      - name: sha256 checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cd ..
      - name: sbom
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843  # v0.24.3
        with:
          path: ./
          output-file: dist/sbom.spdx.json
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"
      - name: github release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231  # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

  ghcr:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tags
        id: tags
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR="${TAG%.*}"
          {
            echo "api_tags=ghcr.io/${GITHUB_REPOSITORY_OWNER}/security-passport-api:v${TAG},ghcr.io/${GITHUB_REPOSITORY_OWNER}/security-passport-api:v${MAJOR_MINOR}"
            echo "web_tags=ghcr.io/${GITHUB_REPOSITORY_OWNER}/security-passport-web:v${TAG},ghcr.io/${GITHUB_REPOSITORY_OWNER}/security-passport-web:v${MAJOR_MINOR}"
          } >> "$GITHUB_OUTPUT"
      - name: api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: ${{ steps.tags.outputs.api_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
      - name: web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: ${{ steps.tags.outputs.web_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
