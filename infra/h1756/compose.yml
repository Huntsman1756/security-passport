# Security Passport — demo deployment on the H1756 VPS
# (passport.h1756.es). Coolify's Traefik terminates TLS and routes
# by label; nothing publishes a host port.
#
# Demo mode: the API replays the captured fixture corpus
# (tests/fixtures/corpus, mounted read-only from
# /data/security-passport/corpus). No OpenInstrument upstream, no
# update timer, no writable state — the demo cannot drift.
#
#   cd /opt/security-passport && git fetch --tags && git checkout vX.Y.Z
#   sudo docker compose -f infra/h1756/compose.yml up -d --build
name: security-passport

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: security-passport-api:${SP_VERSION:-local}
    container_name: security-passport-api
    environment:
      SECURITY_PASSPORT_PROVIDER: fixtures
      SECURITY_PASSPORT_FIXTURES: /corpus
      SECURITY_PASSPORT_CORS_ORIGINS: https://passport.h1756.es
    volumes:
      - /data/security-passport/corpus:/corpus:ro
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    image: security-passport-web:${SP_VERSION:-local}
    container_name: security-passport-web
    environment:
      PUBLIC_BASE_URL: ":80"          # plain HTTP; Traefik owns TLS
      API_UPSTREAM: security-passport-api:8000
    depends_on:
      api:
        condition: service_healthy
    networks: [internal, coolify]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # Caddy binds :80
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.middlewares.security-passport-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.security-passport-redirect.redirectscheme.permanent: "true"
      traefik.http.routers.security-passport-http.entrypoints: http
      traefik.http.routers.security-passport-http.rule: Host(`passport.h1756.es`)
      traefik.http.routers.security-passport-http.middlewares: security-passport-redirect
      traefik.http.routers.security-passport-https.entrypoints: https
      traefik.http.routers.security-passport-https.rule: Host(`passport.h1756.es`)
      traefik.http.routers.security-passport-https.service: security-passport
      traefik.http.routers.security-passport-https.tls: "true"
      traefik.http.routers.security-passport-https.tls.certresolver: letsencrypt
      traefik.http.services.security-passport.loadbalancer.server.port: "80"

networks:
  internal: {}
  coolify:
    external: true
