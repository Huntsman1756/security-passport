[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-passport"
version = "0.1.0"
description = "An evidence-backed operational passport for European financial instruments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "security-passport contributors" }]
keywords = [
    "isin", "cfi", "fisn", "lei", "firds", "prospectus", "ecb",
    "collateral", "settlement", "provenance", "reference-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=15",
    "lxml>=5",
    "typer>=0.12",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-cov>=5",
]

[project.scripts]
security-passport = "security_passport.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/security_passport"]

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Fixture rows must stay single-line verbatim
"tests/fixtures/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["security_passport"]

[[tool.mypy.overrides]]
module = ["bs4", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit real network sources (excluded by default)",
]
addopts = "-m 'not live'"
