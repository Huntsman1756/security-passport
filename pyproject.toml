[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-passport"
version = "0.2.0"
description = "An evidence-backed operational passport for European financial instruments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "security-passport contributors" }]
keywords = [
    "isin", "cfi", "fisn", "lei", "firds", "prospectus", "ecb",
    "collateral", "settlement", "provenance", "reference-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=15",
    "lxml>=5",
    "typer>=0.12",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "python-stdnum>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-cov>=5",
    "schemathesis>=4.0",
]

[project.scripts]
security-passport = "security_passport.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/security_passport"]

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Fixture rows must stay single-line verbatim
"tests/fixtures/**" = ["E501"]
# FastAPI dependency-injection idiom requires callables in
# parameter defaults — Depends() in defaults is the framework's
# documented pattern, not deferred-execution abuse.
"src/security_passport/api/app.py" = ["B008"]
# DuckDB SQL is built over internal generation paths only; all
# runtime values are bound via $1 parameters — never interpolated.
"src/security_passport/storage/store.py" = ["S608"]
# Typer Option() in defaults is the documented CLI idiom.
"src/security_passport/cli/main.py" = ["B008"]
# Outbound fetches are hardcoded to allowlisted HTTPS hosts
# (ecb.europa.eu, registers.esma.europa.eu, iso20022.org).
"src/security_passport/providers/ecb_assets.py" = ["S310"]
"src/security_passport/providers/ecb_sss.py" = ["S310"]
"src/security_passport/providers/esma_prospectus.py" = ["S310"]
"src/security_passport/providers/mic.py" = ["S310"]
"src/security_passport/evidence/__init__.py" = ["S310"]
"src/security_passport/providers/ecb_dictionary.py" = ["S310"]
"tests/integration/test_schemathesis.py" = ["E402"]
"scripts/capture_fixtures.py" = ["S310"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["security_passport"]

[[tool.mypy.overrides]]
module = ["bs4", "bs4.*", "pyarrow", "pyarrow.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit real network sources (excluded by default)",
]
addopts = "-m 'not live'"
